# Reason-code dictionary — 总方案 §5.5。
# 版本化字典：报告生成器只负责解释，不重新判断。
# pipeline failure 与 scientific INCONCLUSIVE 分开编码。
# 本文件先建空框架 + 3 个示例码（各覆盖一类）；后续随实现扩展。

version: "0.4.0-dev"

categories:
  scientific_inconclusive: "证据不足/落入灰区——合法的科学'无法判定'，非流程失败"
  warn: "可继续但需标注/降级（如覆盖偏低）"
  engineering_fail: "工程/资源/配置失败（非科学无法判定）"
  non_authentic: "证据明确否定正品——确定性非正品判定（决策 6，② identify 阶段新增）"

codes:
  - code: INSUFFICIENT_JUNCTION_SUPPORT
    category: scientific_inconclusive
    meaning: "跨 IR/重复区/环化连接的独立长 reads 支持不足，无法判定（非流程失败）"
  - code: LOW_SEQUENCING_DEPTH
    category: warn
    meaning: "回贴 reads 的均一化测序深度低于 policy 阈值（min_mean_depth），不足以支撑可靠判定；INCONCLUSIVE"
  - code: LOW_CALLABLE_COVERAGE
    category: scientific_inconclusive
    meaning: "组装序列覆盖的 callable-region 比例低于 policy 阈值（min_callable_fraction），反映组装完整度不足；INCONCLUSIVE"
  - code: TOOL_MISSING_DIGEST
    category: engineering_fail
    meaning: "工具 container_digest/validation_record 缺失，production 拒绝使用（工程失败，非科学无法判定）"
  # ---- M1-① assembly-stage codes (design 决策 4.2 / 接口合同 §3) ----
  - code: NO_CIRCULARIZATION
    category: warn
    meaning: "plastome 未能环化，仅产出 scaffold（assembly_grade=DRAFT，status=WARN）；不强环化（方法学 §3.6/§5.2）"
  - code: ASSEMBLY_FAILED
    category: engineering_fail
    meaning: "组装未产出可用序列（无 contig / 工具错误），assembly_grade=NOT_APPLICABLE，status=FAIL（非科学灰区）"
  - code: COVERAGE_ANOMALY
    category: scientific_inconclusive
    meaning: "read-back 覆盖异常（双峰 / 异常低覆盖），疑似污染或 NUMT/MTPT 干扰（M1 临时污染信号，Kraken2 自建库落地后细化）；标 INCONCLUSIVE/WARN"
  - code: NUMT_RISK_SUSPECTED
    category: warn
    meaning: "M2 动物线粒体组装结果检出 NUMT 风险信号（覆盖异质性/多重比对异常，numt_risk_screen，方法学 §3.3 首步）；WARN——风险筛查非确证，确证需核侧翼/提前终止/移码检查 + 长读长证据（design known limitations）"
  # ---- M1-② identify-stage codes (design 决策 1 / 决策 6) ----
  - code: INCOMPLETE_ASSEMBLY
    category: warn
    meaning: "身份已确认（诊断位点全部 callable 且一致性满足 pack 规则），但组装结构不完整（DRAFT）；AUTHENTIC+WARN"
  - code: DIAGNOSTIC_SITES_NOT_CALLABLE
    category: scientific_inconclusive
    meaning: "参考 pack 诊断位点落在组装缺失/不可判区，即使全局一致性高也无法做位点级身份判定；INCONCLUSIVE（决策 1 位点级门控）"
  - code: CONTAMINATION_SUSPECTED
    category: scientific_inconclusive
    dormant: true
    meaning: "read-back/组装图污染或 NUMT/MTPT 信号；INCONCLUSIVE，不强判 AUTHENTIC"
    dormant_note: "DORMANT in M1: ① emit_assembly_qc_status 当前不输出 COVERAGE_ANOMALY（Kraken2 自建库缺口，M2 补），且动物×植物混合夹具对质体招募无鉴别力（实测 50:50 后 callable_cov/depth 不变）。正式污染验证改用近缘植物混合夹具，随 Kraken2 自建库 change 一并实装并移除 dormant 标记。"
  - code: THRESHOLD_NOT_CONFIGURED
    category: scientific_inconclusive
    meaning: "policy 判定阈值为 null（模块层防御，决策 2）；输出 INCONCLUSIVE，非崩溃"
  - code: IDENTITY_BELOW_THRESHOLD
    category: non_authentic
    meaning: "诊断位点一致性低于 reference-pack conflict_rules 阈值；NON_AUTHENTIC"
