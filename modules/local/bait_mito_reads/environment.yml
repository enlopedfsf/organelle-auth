---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/environment-schema.json
# Mito-enriched bait extraction: minimap2 (-ax sr) + samtools (view/collate/fixmate/fastq).
# Runtime container = community.wave.seqera.io/library/minimap2_samtools (matches nf-core minimap2/align).
channels:
  - conda-forge
  - bioconda
dependencies:
  - minimap2=2.28
  - samtools=1.21
