---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/environment-schema.json
# NUMT risk screening: python3 (metrics) + samtools (BAM flag counting).
# Runtime container = community.wave.seqera.io/library/minimap2_samtools (has samtools + python3).
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - samtools=1.21
