name: emit_identify_status
description: Write the schema_status.json-valid stage=identify status JSON (decision filled) and stage ① evidence + the decision record under the frozen contract tree plant_sr_assembly/<sid>/.
keywords:
  - status
  - evidence
  - identify
tools:
  - python:
      description: JSON status construction + file staging; no third-party bioinformatics tool.
      licence: ["PSF-2.0"]
input:
  - - meta:
        type: map
        description: Sample metadata.
    - decision_json:
        type: file
        description: decision.json from DECISION_ENGINE.
    - plastome:
        type: file
        description: ① selected plastome FASTA.
    - graph:
        type: file
        description: ① assembly graph (.fastg).
    - nrdna:
        type: file
        description: ① nrDNA FASTA.
    - bam:
        type: file
        description: ① read-back sorted BAM.
    - depth:
        type: file
        description: ① samtools depth TSV.
    - flagstat:
        type: file
        description: ① samtools flagstat TXT.
    - asm_status_json:
        type: file
        description: ① stage=assembly_qc status JSON.
output:
  status_json:
    - - meta:
          type: map
      - "*.identify.status.json":
          type: file
          description: stage=identify status object (schema_status.json-valid, decision filled).
  staged_tree:
    - - "plant_sr_assembly/<sid>":
          type: directory
          description: Contract tree with ① evidence + identify decision record.
  versions:
    - - "${task.process}":
          type: string
      - emit_identify_status:
          type: string
      - "0.1.0":
          type: string
authors:
  - "enlopedfsf"
