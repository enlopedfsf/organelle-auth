name: PMAT2 fix-or-drop (single CI attempt)

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-runtime:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}@${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - id: image
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/pmat2-fix-or-drop:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: containers/pmat2-fix-or-drop
          push: true
          tags: ${{ steps.image.outputs.image }}
      - name: Verify executable in built image
        run: docker run --rm "${{ steps.image.outputs.image }}" sh -lc 'command -v PMAT || command -v PMAT2 || command -v autoMito; (PMAT --help || PMAT2 --help || autoMito --help) >/tmp/pmat2-help.txt'

  plant-comparator:
    needs: build-runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download SRR38978847 and deterministically rebuild frozen recruitment
        run: |
          mkdir -p runs/input runs/output/pmat2-fix-or-drop
          sudo apt-get update -qq && sudo apt-get install -y -qq sra-toolkit minimap2
          prefetch --output-directory runs/input --max-size 20G SRR38978847
          fasterq-dump --threads 4 --stdout runs/input/SRR38978847/SRR38978847.sra | gzip -c > runs/input/SRR38978847.fastq.gz
          bash scripts/rebuild_plant_recruited.sh runs/input/SRR38978847.fastq.gz runs/input/rebuilt
          cp runs/input/rebuilt/SRR38978847.final-recruited.fastq.gz runs/input/SRR38978847.final-recruited.fastq.gz
          echo '93f4fd3bc3969e5d4d3577870b32f4a63d99ddc57a325f84403d7f089531f3c8  runs/input/SRR38978847.final-recruited.fastq.gz' | sha256sum -c -
      - name: Run exactly one PMAT2 comparator
        env:
          IMAGE: ${{ needs.build-runtime.outputs.image }}
        run: |
          set -o pipefail
          docker run --rm -v "$PWD/runs:/runs" "$IMAGE" sh -lc 'PMAT autoMito -p 0 -i /runs/input/SRR38978847.final-recruited.fastq.gz -o /runs/output/pmat2-fix-or-drop 2>&1 | tee /runs/output/pmat2-fix-or-drop/pmat2.log'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pmat2-fix-or-drop-${{ github.sha }}
          path: runs/output/pmat2-fix-or-drop
