# Tool registry — 总方案 §8.2 条目结构 + §8.3 首版候选分层。
#
# 语义区分（重要）：
#   PROHIBITED = 当前有明确科学理由禁用（见各条 reason）；须满足 re_evaluation_trigger 才可重新评估。
#   DEFERRED   = 暂无条件评估；证据/资源到位即可激活，无需"解禁"科学理由。
#
# 当 container_digest 或 validation_record 为 null 时，production profile 拒绝使用该工具（§8.2 / asset-tool-and-policy 规范域）。
# 这里的初始等级是开发起点，不是最终 SOP 批准结论（§8.3）。

